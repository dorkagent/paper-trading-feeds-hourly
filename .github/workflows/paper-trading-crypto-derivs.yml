name: paper-trading-crypto-derivs
on:
  schedule:
    - cron: '7 * * * *'  # hourly at :07 UTC
  workflow_dispatch:  # manual trigger
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run feed script
        run: python3 scripts/crypto-derivs.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hidden_files/crypto-derivs/
          git diff --cached --quiet || git commit -m "paper-trading-crypto-derivs $(date -u +%F\ %H:%M)"
          git push
